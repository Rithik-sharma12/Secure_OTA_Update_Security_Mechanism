; ──────────────────────────────────────────────────
; platformio.ini  –  ESP32 Multi-OTA project
; ──────────────────────────────────────────────────
; Install PlatformIO: pip install platformio
; Build:  pio run
; Upload: pio run --target upload
; Monitor: pio device monitor
; ──────────────────────────────────────────────────

[platformio]
; Source files are in the esp32_ota_main sketch folder.
src_dir = esp32_ota_main

[env:esp32dev]
; Standard ESP32 DevKit
platform   = espressif32
board      = esp32dev
framework  = arduino
board_upload.speed = 921600

monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=3

; Upload via USB serial (esptool under the hood)
; Run:  pio run -t upload -e esp32dev

; ──────────────────────────────────────────────────

[env:esp32s3]
; ESP32-S3 variant
platform   = espressif32
board      = esp32-s3-devkitc-1
framework  = arduino
board_upload.speed = 921600

monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=3

; ──────────────────────────────────────────────────

[env:esp32c3]
; ESP32-C3 variant
platform   = espressif32
board      = esp32-c3-devkitm-1
framework  = arduino
board_upload.speed = 921600

monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=3

; ──────────────────────────────────────────────────
; OTA upload environment (push via ArduinoOTA/network)
; Replace with actual device IP after first serial flash
; ──────────────────────────────────────────────────

[env:esp32dev_ota]
platform   = espressif32
board      = esp32dev
framework  = arduino

upload_protocol  = espota
upload_port      = ${sysenv.ESP32_OTA_HOST}
upload_flags     =
    --auth=${sysenv.ESP32_OTA_PASSWORD}

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

; Run:  pio run -t upload -e esp32dev_ota
