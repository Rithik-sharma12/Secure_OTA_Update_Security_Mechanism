# SecureOTA — CLOUD / INTERNET deployment
#
#   docker compose -f docker-compose.cloud.yml \
#     --env-file .env.docker up -d
#
# Dashboard : https://ota.nyx-ctf.tech   (put Cloudflare Access on THIS one)
# Gateway   : https://gw.nyx-ctf.tech    (must stay open — devices poll it)
#
# Adds cloudflared to the same project as the base stack, so one command
# brings up everything and `docker compose down` takes it all with it.
# No inbound ports are opened; cloudflared dials out to Cloudflare.
#
# Requires on the device side: firmware built with BACKEND_URL set to the
# https gateway and OTA_ROOT_CA pinned. See
# docs/guides/CLOUDFLARE_TUNNEL_SETUP.md.

name: secure_ota

include:
  - path: ./docker-compose.yml

services:
  gateway:
    environment:
      # Public hostname devices download firmware from. No :5000 — Cloudflare
      # serves 443 and the tunnel maps it to the container port.
      # Deliberately invalid fallback — see the note in docker-compose.local.yml.
      OTA_GATEWAY_PUBLIC_URL: ${OTA_PUBLIC_URL:-https://OTA-PUBLIC-URL-NOT-SET-PASS-ENV-FILE}

  ota_ide:
    environment:
      # Written into boards provisioned over USB from the Devices page.
      OTA_DEVICE_GATEWAY_URL: ${OTA_DEVICE_GATEWAY_URL:-${OTA_PUBLIC_URL:-}}

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: secure_ota_cloudflared
    restart: unless-stopped
    # Start with the other containers, not after them. Waiting for
    # "service_healthy" meant one slow or failed health check kept the tunnel
    # down entirely, and Cloudflare then answers every visitor with error 1033
    # ("no connector for this tunnel"). Up early, the tunnel shows a short 502
    # while the dashboard boots instead, and recovers on its own.
    depends_on:
      gateway:
        condition: service_started
      ota_ide:
        condition: service_started
    # Locally-managed mode: ingress rules live in deploy/cloudflared/config.yml in this
    # repo. Token mode ignores local ingress entirely and answers 503 to every
    # request, which is a confusing failure — keep this as --config.
    # --protocol http2: QUIC (the default) runs over UDP 7844, which Docker
    # Desktop's NAT, many routers and campus networks drop or throttle; that
    # shows up as stalls and connections flapping (1033 between reconnects).
    # HTTP/2 over TCP 7844 is steady.
    command: tunnel --no-autoupdate --protocol http2 --loglevel info --config /etc/cloudflared/config.yml run
    volumes:
      # config.yml is committed; credentials.json is git-ignored.
      - ./deploy/cloudflared:/etc/cloudflared:ro
    networks:
      - secureota_network
