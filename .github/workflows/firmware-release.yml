# ─────────────────────────────────────────────────────────
# Triggers on push of a version tag (v1.0.0, v2.4.1, etc.)
# Builds the ESP32 firmware and creates a GitHub Release
# with the .bin attached – ready for devices to pull.
#
# FAILS CLOSED: a tag without FIRMWARE_ENC_KEY and
# FIRMWARE_PRIV_KEY configured stops before publishing, rather
# than shipping an unsigned release devices would trust by
# digest alone. Set the repository variable
# ALLOW_UNSIGNED_RELEASE=true to publish plain builds on purpose
# (bench work). See the secrets list at the bottom of this file.
# ─────────────────────────────────────────────────────────

name: Build & Release ESP32 Firmware

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # matches v1.0.0, v2.4.1 …

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    # The PlatformIO project lives in a subdirectory. This applies to `run:`
    # steps ONLY — `uses:` steps still resolve paths from the repo root, which
    # is why hashFiles() and the release `files:` glob below are fully
    # qualified.
    defaults:
      run:
        working-directory: CODE/firmware_code

    steps:
      # ── 1. Checkout source ────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Cache PlatformIO libraries/toolchains ──────────
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          # hashFiles() is always repo-root relative, regardless of
          # defaults.run.working-directory.
          key: pio-${{ hashFiles('CODE/firmware_code/platformio.ini') }}

      # ── 3. Install PlatformIO ─────────────────────────────
      - name: Install PlatformIO
        run: pip install platformio

      # ── 4. Inject secrets into ota_config.h ──────────────
      # Wi-Fi and OTA secrets live in GitHub repo secrets, NOT in the source
      # tree.
      #
      # This MUST be written to esp32_ota_main/, not the project root:
      # platformio.ini sets `src_dir = esp32_ota_main`, and the sketch does
      # `#include "ota_config.h"`, which a quoted include resolves relative to
      # the including file. A root-level copy is never seen by the compiler, so
      # the build would silently use the checked-in YOUR_WIFI_SSID placeholder.
      - name: Create ota_config.h from secrets
        run: |
          cat > esp32_ota_main/ota_config.h <<'EOF'
          #pragma once
          #define WIFI_SSID       "${{ secrets.WIFI_SSID }}"
          #define WIFI_PASSWORD   "${{ secrets.WIFI_PASSWORD }}"
          #define OTA_PASSWORD    "${{ secrets.OTA_PASSWORD }}"
          #define DEVICE_HOSTNAME "auto"
          #define BACKEND_URL     "${{ secrets.BACKEND_URL }}"
          #define DEVICE_ID       "auto"  // unique per board, derived from the chip MAC
          #define DEVICE_TYPE     "ESP32"
          #define BACKEND_API_KEY "${{ secrets.BACKEND_API_KEY }}"
          #define OTA_NTP_SERVER_PRIMARY   "pool.ntp.org"
          #define OTA_NTP_SERVER_SECONDARY "time.nist.gov"
          #define OTA_CHECK_INTERVAL_SECONDS 30
          #define FIRMWARE_ENC_KEY "${{ secrets.FIRMWARE_ENC_KEY }}"
          static const char OTA_ROOT_CA[] PROGMEM = "${{ secrets.OTA_ROOT_CA }}";
          static const char FIRMWARE_PUB_KEY[] = R"KEY(
          ${{ secrets.FIRMWARE_PUB_KEY }}
          )KEY";
          EOF
          echo "Wrote esp32_ota_main/ota_config.h ($(wc -l < esp32_ota_main/ota_config.h) lines)"

      # ── 4b. Tag must match the version compiled into the image ─
      # The device compares the signed package version with FIRMWARE_VERSION
      # in the running image. If the tag and the sketch disagree, a board
      # flashes the release, reports the old version and is offered the same
      # release again forever.
      - name: Check tag matches FIRMWARE_VERSION
        run: |
          SKETCH_VERSION=$(sed -n 's/^#define FIRMWARE_VERSION[[:space:]]*"\([^"]*\)".*/\1/p' esp32_ota_main/esp32_ota_main.ino)
          if [ "v$SKETCH_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match FIRMWARE_VERSION \"$SKETCH_VERSION\" in esp32_ota_main.ino."
            exit 1
          fi
          # FIRMWARE_VERSION_N is what the anti-rollback check compares; it
          # must be major*1000000 + minor*1000 + patch of FIRMWARE_VERSION.
          SKETCH_VERSION_N=$(sed -n 's/^#define FIRMWARE_VERSION_N[[:space:]]*\([0-9]*\).*/\1/p' esp32_ota_main/esp32_ota_main.ino)
          IFS=. read -r MAJOR MINOR PATCH <<< "$SKETCH_VERSION"
          EXPECTED_N=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          if [ "$SKETCH_VERSION_N" != "$EXPECTED_N" ]; then
            echo "::error::FIRMWARE_VERSION_N is $SKETCH_VERSION_N; FIRMWARE_VERSION $SKETCH_VERSION needs $EXPECTED_N."
            exit 1
          fi

      # ── 5. Static analysis ────────────────────────────────
      # There is no unit-test harness for the embedded C++, so the compile
      # below is the real gate. This adds a cheap advisory pass on top.
      #
      # continue-on-error because no lint baseline exists yet — a hard gate
      # would block every release on pre-existing warnings. Drop it once the
      # tree is clean if you want failures to block a release.
      - name: Static analysis (advisory)
        continue-on-error: true
        run: pio check --skip-packages -e esp32dev

      # ── 6. Build for all board variants ───────────────────
      # Any compile error fails the workflow and no release is published.
      - name: Build esp32dev
        run: pio run -e esp32dev

      - name: Build esp32s3
        run: pio run -e esp32s3

      - name: Build esp32c3
        run: pio run -e esp32c3

      # ── 7. Rename binaries to include board & version ─────
      - name: Rename firmware binaries
        run: |
          TAG=${{ github.ref_name }}
          mkdir -p release-assets

          cp .pio/build/esp32dev/firmware.bin  release-assets/firmware-esp32-${TAG}.bin
          cp .pio/build/esp32s3/firmware.bin   release-assets/firmware-esp32s3-${TAG}.bin
          cp .pio/build/esp32c3/firmware.bin   release-assets/firmware-esp32c3-${TAG}.bin

          # Also copy as the "latest" names (devices match on 'esp32')
          cp .pio/build/esp32dev/firmware.bin  release-assets/firmware-esp32.bin
          cp .pio/build/esp32s3/firmware.bin   release-assets/firmware-esp32s3.bin
          cp .pio/build/esp32c3/firmware.bin   release-assets/firmware-esp32c3.bin

      # ── 7a. Factory images for first flash over USB ───────
      # A blank board has no bootloader or partition table, and the OTA asset
      # below becomes an encrypted package, so neither can bring it up over
      # USB. Merge bootloader + partitions + boot_app0 + the plain app into one
      # image written at 0x0. The gateway attaches it to the release (only if
      # its app region matches the release's plaintext digest) and serves it
      # to signed-in operators for the dashboard's "Set up a new board" flow.
      # Kept out of release-assets/ until after encryption so it stays plain.
      - name: Build factory images
        run: |
          TAG=${{ github.ref_name }}
          pip install -q esptool
          BOOT_APP0=$(ls -d ~/.platformio/packages/framework-arduinoespressif32*/tools/partitions/boot_app0.bin | head -1)
          mkdir -p factory-assets
          for pair in esp32dev:esp32:esp32:0x1000 esp32s3:esp32s3:esp32s3:0x0 esp32c3:esp32c3:esp32c3:0x0; do
            IFS=: read -r ENV CHIP NAME BOOT_OFF <<< "$pair"
            OUT=.pio/build/$ENV
            python -m esptool --chip "$CHIP" merge_bin -o "factory-assets/firmware-$NAME-full.bin" \
              "$BOOT_OFF" "$OUT/bootloader.bin" \
              0x8000 "$OUT/partitions.bin" \
              0xe000 "$BOOT_APP0" \
              0x10000 "$OUT/firmware.bin"
            cp "factory-assets/firmware-$NAME-full.bin" "factory-assets/firmware-$NAME-$TAG-full.bin"
          done
          ls -l factory-assets

      # ── 7b. Record what CI built, before anything is encrypted ─
      # imageSha256 is the digest of the PLAINTEXT image. The gateway cannot
      # derive it from an encrypted package without the AES key, and the
      # device needs it to bind the flashed image to the version it was
      # offered. Written to release-manifest.json in step 9.
      - name: Record plaintext image digests
        run: |
          cd release-assets
          sha256sum *.bin > ../image-sha256.txt
          cat ../image-sha256.txt

      # ── 8. Sign & encrypt firmware binaries ───────────────
      # The signing keys are checked inside the script, not in an `if:`
      # condition: the `secrets` context is not available to step-level `if:`,
      # and referencing it there makes the whole workflow fail to parse.
      - name: Sign & encrypt firmware binaries
        env:
          FIRMWARE_ENC_KEY: ${{ secrets.FIRMWARE_ENC_KEY }}
          FIRMWARE_PRIV_KEY: ${{ secrets.FIRMWARE_PRIV_KEY }}
          ALLOW_UNSIGNED_RELEASE: ${{ vars.ALLOW_UNSIGNED_RELEASE }}
        run: |
          if [ -z "$FIRMWARE_ENC_KEY" ] || [ -z "$FIRMWARE_PRIV_KEY" ]; then
            if [ "$ALLOW_UNSIGNED_RELEASE" = "true" ]; then
              echo "::warning::FIRMWARE_ENC_KEY / FIRMWARE_PRIV_KEY are not set and ALLOW_UNSIGNED_RELEASE=true — publishing PLAIN, UNSIGNED binaries."
              echo "false" > secure-mode.txt
              exit 0
            fi
            echo "::error::FIRMWARE_ENC_KEY / FIRMWARE_PRIV_KEY are not set. Refusing to publish an unsigned release."
            echo "::error::Configure both secrets, or set the repository variable ALLOW_UNSIGNED_RELEASE=true for a deliberate plain build."
            exit 1
          fi
          echo "true" > secure-mode.txt

          if [ ${#FIRMWARE_ENC_KEY} -ne 32 ]; then
            echo "FIRMWARE_ENC_KEY must be exactly 32 characters for AES-256."
            exit 1
          fi

          echo "Signing and encrypting firmware binaries..."

          # Packages are built by gateway/package.py (through the bench tool),
          # the single definition of the format. Its default, signature_alg 3,
          # signs the release version together with the image so a device can
          # refuse a downgrade without trusting the manifest. Firmware refuses
          # the old openssl-built, unversioned packages by default.
          VERSION="${GITHUB_REF_NAME#v}"
          pip install -q cryptography
          KEYS_DIR="$RUNNER_TEMP/release-keys"
          mkdir -p "$KEYS_DIR"
          ( umask 077; printf '%s\n' "$FIRMWARE_PRIV_KEY" > "$KEYS_DIR/firmware_test_private.pem" )

          for f in release-assets/*.bin; do
            echo "Processing $f..."
            python tools/create_secure_test_package.py \
              --firmware "$f" \
              --version "$VERSION" \
              --aes-key "$FIRMWARE_ENC_KEY" \
              --keys-dir "$KEYS_DIR" \
              --output "$f.secure" > /dev/null
            mv "$f.secure" "$f"
          done

          rm -rf "$KEYS_DIR"

      # ── 9. Compute SHA-256 checksums + release manifest ───
      # release-manifest.json is what the gateway's GitHub webhook
      # (/api/github/webhook) reads: per asset, the digest as served, the
      # plaintext digest and whether it is an encrypted package. Factory
      # images join here, after encryption, so they stay plain.
      - name: Compute checksums and release manifest
        run: |
          cp factory-assets/*.bin release-assets/
          cd release-assets
          sha256sum *.bin > checksums.txt
          cat checksums.txt
          python3 - <<'PY'
          import json
          served = dict(reversed(l.split()) for l in open('checksums.txt') if l.strip())
          plain = dict(reversed(l.split()) for l in open('../image-sha256.txt') if l.strip())
          secure = open('../secure-mode.txt').read().strip() == 'true'
          manifest = {
              'tag': '${{ github.ref_name }}',
              'commit': '${{ github.sha }}',
              'assets': {
                  name: (
                      {'sha256': digest, 'factory': True, 'securePackage': False}
                      if name.endswith('-full.bin') else
                      {'sha256': digest, 'imageSha256': plain.get(name), 'securePackage': secure}
                  )
                  for name, digest in served.items()
              },
          }
          json.dump(manifest, open('release-manifest.json', 'w'), indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      # ── 10. Create GitHub Release & upload assets ─────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Firmware ${{ github.ref_name }}"
          body: |
            ## ESP32 OTA Firmware ${{ github.ref_name }}

            ### Files
            | File | Board |
            |------|-------|
            | `firmware-esp32.bin` | ESP32 DevKit |
            | `firmware-esp32s3.bin` | ESP32-S3 |
            | `firmware-esp32c3.bin` | ESP32-C3 |
            | `firmware-*-full.bin` | Factory image for a blank board (bootloader + partitions + app), written at 0x0 |

            ### First flash of a blank board (USB)
            Dashboard → Devices → **Set up a new board** flashes the factory
            image over the COM port, provisions Wi-Fi and the device token,
            and waits for the first heartbeat. Manually:
            ```bash
            esptool.py --chip esp32 --port COM3 write_flash 0x0 firmware-esp32-full.bin
            ```
            The `firmware-esp32.bin` assets are OTA packages, not for USB.

            ### OTA
            If the gateway's GitHub webhook is configured, this release is
            published to the gateway automatically (verified against
            `release-manifest.json`). Devices poll the gateway every 30 s by default
            (`OTA_CHECK_INTERVAL_SECONDS`) and pick this up on the next check.
            You can also trigger manually by holding the BOOT button for 3 s.
          # Repo-root relative: `uses:` steps do not inherit
          # defaults.run.working-directory.
          files: |
            CODE/firmware_code/release-assets/*.bin
            CODE/firmware_code/release-assets/checksums.txt
            CODE/firmware_code/release-assets/release-manifest.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ─────────────────────────────────────────────────────────
# Required GitHub Secrets (Settings → Secrets → Actions):
#
#   WIFI_SSID      – Wi-Fi network name
#   WIFI_PASSWORD  – Wi-Fi password
#   OTA_PASSWORD   – ArduinoOTA push password
#   BACKEND_URL    – gateway base URL, e.g. http://<pc-lan-ip>:5000
#   BACKEND_API_KEY – optional API key accepted by gateway
#   (DEVICE_ID is no longer a secret: release builds use "auto", a per-board
#    id derived from the chip MAC. Wi-Fi, gateway URL and device token can
#    also be provisioned per board over USB from the dashboard.)
#   FIRMWARE_ENC_KEY – 32-character AES key (required for secure package mode)
#   FIRMWARE_PUB_KEY – PEM public key used by device for signature verification
#   FIRMWARE_PRIV_KEY – PEM private key used by CI for signing
#   OTA_ROOT_CA    – optional; PEM root CA, only needed when BACKEND_URL is
#                    https. Leave unset for plain http deployments.
#
# Set them with:
#   gh secret set WIFI_SSID --repo Rithik-sharma12/Secure_OTA_Update_Security_Mechanism
#
# GITHUB_TOKEN is provided automatically by GitHub Actions.
# ─────────────────────────────────────────────────────────
