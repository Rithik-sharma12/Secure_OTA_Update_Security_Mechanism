name: secure_ota

services:
  gateway:
    build:
      context: ./apps/gateway
      dockerfile: Dockerfile
    pull_policy: build
    image: secure-ota-gateway:latest
    container_name: secure_ota_gateway
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      OTA_GATEWAY_HOST: 0.0.0.0
      OTA_GATEWAY_PORT: 5000
      OTA_GATEWAY_API_KEY: ${OTA_GATEWAY_API_KEY:?set OTA_GATEWAY_API_KEY in .env - see .env.example}
      OTA_GATEWAY_PUBLIC_URL: ${OTA_GATEWAY_PUBLIC_URL:-http://localhost:5000}
      OTA_AUTO_UPDATE: ${OTA_AUTO_UPDATE:-true}
      OTA_REQUIRE_DEVICE_TOKEN: ${OTA_REQUIRE_DEVICE_TOKEN:-false}
      OTA_GATEWAY_SIGNING_KEY_ID: ${OTA_GATEWAY_SIGNING_KEY_ID:-gateway-ed25519-primary}
      OTA_GATEWAY_RELEASE_ARTIFACT: ${OTA_GATEWAY_RELEASE_ARTIFACT:-}
      OTA_GATEWAY_ARTIFACT_DIRS: ${OTA_GATEWAY_ARTIFACT_DIRS:-}
      OTA_GATEWAY_PUBLIC_READS: ${OTA_GATEWAY_PUBLIC_READS:-}
      OTA_GATEWAY_CACHE_DIR: /app/gateway_firmware_cache
      OTA_GATEWAY_KEYS_DIR: /app/gateway_keys
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:5000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - gateway_cache:/app/gateway_firmware_cache
      - gateway_keys:/app/gateway_keys
    networks:
      - sentinel_network

  ota_ide:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      # Baked into the browser bundle at build time (see the Dockerfile).
      # Compose reads these from --env-file .env.docker or the shell.
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    pull_policy: build
    image: secure-ota-ide:latest
    container_name: secure_ota_ide
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      OTA_ADMIN_USERNAME: ${OTA_ADMIN_USERNAME:-secure-ota-admin}
      OTA_ADMIN_PASSWORD: ${OTA_ADMIN_PASSWORD:?set OTA_ADMIN_PASSWORD in .env - see .env.example}
      OTA_SESSION_TTL_HOURS: ${OTA_SESSION_TTL_HOURS:-24}
      OTA_LOCAL_DB_DIR: /app/.local-db
      EDGE_GATEWAY_URL: http://gateway:5000
      # Address boards use to reach the gateway; written to a board when it is
      # provisioned over USB from the Devices page.
      OTA_DEVICE_GATEWAY_URL: ${OTA_DEVICE_GATEWAY_URL:-${OTA_GATEWAY_PUBLIC_URL:-}}
      EDGE_GATEWAY_API_KEY: ${OTA_GATEWAY_API_KEY:?set OTA_GATEWAY_API_KEY in .env - see .env.example}
      OTA_RUNTIME_COMMANDS_ENABLED: ${OTA_RUNTIME_COMMANDS_ENABLED:-false}
      OTA_RUNTIME_COMMAND_TOKEN: ${OTA_RUNTIME_COMMAND_TOKEN:-}
      OTA_RUNTIME_COMMAND_ALLOWLIST: ${OTA_RUNTIME_COMMAND_ALLOWLIST:-echo,dir,ls,pwd,whoami,node,python,py}
      OTA_RUNTIME_COMMAND_CWD: /app
      ARDUINO_CLI_PATH: arduino-cli
      OTA_UPLOAD_MAX_LOGS: 1000
      OTA_FQBN_ESP32: esp32:esp32:esp32
      OTA_FQBN_ESP8266: esp8266:esp8266:generic
      OTA_FQBN_ATMEGA328P: arduino:avr:uno
      OTA_FQBN_STM32F103: STMicroelectronics:stm32:GenF1
      # Firmware built on this computer by scripts\build-firmware.cmd, so the
      # Devices page can flash and publish it. HOST_DIR is only for display.
      SECUREOTA_FIRMWARE_DIST: /app/firmware-dist
      SECUREOTA_FIRMWARE_HOST_DIR: ${SECUREOTA_REPO_DIR:-.}/firmware/dist
    ports:
      - "3000:3000"
    # /api/health/live answers without auth, Clerk, the gateway or the
    # database. Probing "/" rendered the whole landing page (and called Clerk)
    # every 15 s, and a slow render marked the container unhealthy.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3000/api/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - ota_ide_db:/app/.local-db
      - ./firmware/dist:/app/firmware-dist:ro
    networks:
      - sentinel_network

volumes:
  gateway_cache:
    name: sentinel_gateway_cache
  gateway_keys:
    name: sentinel_gateway_keys
  ota_ide_db:
    name: sentinel_ota_ide_db

networks:
  sentinel_network:
    name: sentinel_network
    driver: bridge
